    <style>
        .navbar-nav .nav-link {
            transition: color 0.3s ease, border-color 0.3s ease;
            padding-bottom: 5px;
            margin-left: 15px;
            border-bottom: 2px solid transparent;
        }

        .navbar-nav .nav-link:hover {

        }

        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 2px 2px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transition: transform 0.3s ease, background-color 0.3s ease;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: #128c7e;
            color: white;
        }

        .back-to-top {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background-color: #1e30f3;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 2px 2px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            cursor: pointer;
        }

        .back-to-top.show {
            display: flex;
        }

        .back-to-top:hover {
            transform: scale(1.1);
            background-color: #e21e80;
        }

        /* Success banner animation */
        #successBanner {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        #successBanner.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">

        <!-- Navbar -->
        <!-- Navbar Header (Loaded dynamically) -->
        <div data-layout="header"></div>

        <!-- Contact Section -->
        <section class="py-5">
            <div class="container px-5">
                <div class="bg-light rounded-4 py-5 px-4 px-md-5">
                    <div class="text-center mb-5">
                        <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3">
                            <i class="bi bi-envelope"></i>
                        </div>
                        <h1 class="fw-bolder">Get in touch</h1>
                        <p class="lead fw-normal text-muted mb-0">Let's work together!</p>
                    </div>
                    <div class="row gx-5 justify-content-center">
                        <div class="col-lg-8 col-xl-6">

                            <!-- Success/Error handled by SweetAlert2 -->

                            <form id="contactForm" action="https://formspree.io/f/mrejlvjk" method="POST">
                                <!-- Name input -->
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="name" name="name" type="text"
                                        placeholder="Enter your name..." required data-fs-field />
                                    <label for="name">Full name</label>
                                </div>
                                <!-- Email address input -->
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="email" name="email" type="email"
                                        placeholder="name@example.com" required data-fs-field />
                                    <label for="email">Email address</label>
                                </div>
                                <!-- Phone number input -->
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="phone" name="phone" type="tel"
                                        placeholder="(123) 456-7890" required data-fs-field />
                                    <label for="phone">Phone number</label>
                                </div>
                                <!-- Message input -->
                                <div class="form-floating mb-3">
                                    <textarea class="form-control" id="message" name="message"
                                        placeholder="Enter your message here..." style="height: 10rem" required
                                        data-fs-field></textarea>
                                    <label for="message">Message</label>
                                </div>
                                <!-- Submit Button -->
                                <div class="d-grid">
                                    <button class="btn btn-primary btn-lg" id="submitButton" type="submit"
                                        data-fs-submit-btn>
                                        Submit Message
                                    </button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer (Loaded dynamically) -->
    <div data-layout="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>

    <!-- Formspree Library & Initialization -->
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
    <script>
        // Robust Form Validation (Bypass-Proof)
        (function () {
            const contactForm = document.getElementById('contactForm');
            if (contactForm) {
                const nameInput = document.getElementById('name');
                const emailInput = document.getElementById('email');
                const phoneInput = document.getElementById('phone');
                const messageInput = document.getElementById('message');

                // Clear invalid style instantly when the user types
                [nameInput, emailInput, phoneInput, messageInput].forEach(input => {
                    input.addEventListener('input', function () {
                        input.classList.remove('is-invalid');
                    });
                });

                contactForm.addEventListener('submit', function (e) {
                    let isValid = true;
                    let errors = [];

                    // Reset previous custom invalid styles
                    [nameInput, emailInput, phoneInput, messageInput].forEach(input => {
                        input.classList.remove('is-invalid');
                    });

                    // 1. Full Name Validation
                    const nameVal = nameInput.value.trim();
                    if (nameVal.length < 3) {
                        isValid = false;
                        nameInput.classList.add('is-invalid');
                        errors.push('Full name must be at least 3 characters long.');
                    }

                    // 2. Email Validation
                    const emailVal = emailInput.value.trim();
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(emailVal)) {
                        isValid = false;
                        emailInput.classList.add('is-invalid');
                        errors.push('Please enter a valid email address.');
                    }

                    // 3. Phone Validation
                    const phoneVal = phoneInput.value.trim();
                    // Validates numbers, plus sign, spaces, dashes, or parentheses; min 7 digits
                    const phoneRegex = /^[0-9+\s\-()]{7,20}$/;
                    if (!phoneRegex.test(phoneVal)) {
                        isValid = false;
                        phoneInput.classList.add('is-invalid');
                        errors.push('Please enter a valid contact number.');
                    }

                    // 4. Message Validation
                    const messageVal = messageInput.value.trim();
                    if (messageVal.length < 5) {
                        isValid = false;
                        messageInput.classList.add('is-invalid');
                        errors.push('Message must be at least 5 characters long to avoid spam.');
                    }

                    if (!isValid) {
                        e.preventDefault();
                        e.stopImmediatePropagation(); // Stops Formspree and all other handlers

                        Swal.fire({
                            title: 'Validation Error! ⚠️',
                            html: `<div style="text-align: left; font-size: 15px; margin-top: 10px;">
                                    ${errors.map(err => `<p style="margin-bottom: 8px; color: #dc3545;"><i class="bi bi-x-circle-fill me-2"></i>${err}</p>`).join('')}
                                   </div>`,
                            icon: 'error',
                            confirmButtonColor: '#1e30f3'
                        });
                    }
                });
            }
        })();

        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', {
            formElement: '#contactForm',
            formId: 'mrejlvjk',
            onSuccess: function () {
                // Premium Success Animation (Confetti)
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#1e30f3', '#e21e80', '#ffffff']
                });

                // Show Premium "Thank You" Modal
                Swal.fire({
                    title: 'Message Sent! 🚀',
                    html: `
                        <div class="text-start">
                            <p>Thank you so much for reaching out, <b>${document.getElementById('name').value}</b>!</p>
                            <p>I have received your message and will get back to you as soon as possible.</p>
                        </div>
                    `,
                    icon: 'success',
                    showConfirmButton: true,
                    confirmButtonText: 'Great!',
                    confirmButtonColor: '#1e30f3',
                    background: '#ffffff',
                    customClass: {
                        popup: 'rounded-4 shadow-lg border-0',
                        title: 'fw-bolder text-primary',
                        confirmButton: 'px-4 py-2 rounded-3'
                    }
                });

                // Reset form
                document.getElementById('contactForm').reset();
            },
            onError: function () {
                Swal.fire({
                    title: 'Oops! 😕',
                    text: 'There was a problem sending your message. Please try again or contact me via WhatsApp.',
                    icon: 'error',
                    confirmButtonColor: '#1e30f3'
                });
            }
        });

        // Back to Top Logic
        const backToTop = document.getElementById('backToTop');
        if (backToTop) {
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 300) backToTop.classList.add('show');
                else backToTop.classList.remove('show');
            });
            backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }
    </script>

    <a href="https://wa.me/923017730687?text=Hello%20Afaq%20Tahir" target="_blank" class="whatsapp-float"
        title="Chat on WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>
    <button id="backToTop" class="back-to-top" title="Back to Top">
        <i class="bi bi-arrow-up"></i>
    </button>

</body>

</html>
